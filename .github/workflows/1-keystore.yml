name: 1 · Generate signing key (run once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore readest-selfhosted.jks \
            -alias readest \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass readest-selfhosted \
            -keypass readest-selfhosted \
            -dname "CN=Readest Self-Hosted, O=Personal, C=CN"

      - name: Encode as base64
        run: base64 -w0 readest-selfhosted.jks > keystore-base64.txt

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keystore-base64
          path: keystore-base64.txt
          retention-days: 1
